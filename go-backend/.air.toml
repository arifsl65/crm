# Air configuration for hot reload during development
# https://github.com/cosmtrek/air

root = "."
tmp_dir = "tmp"

[build]
  # Command to build the binary
  cmd = "go build -o ./tmp/main ./cmd/server"
  # Binary file to run
  bin = "./tmp/main"
  # Watch these directories
  include_dir = ["cmd", "internal"]
  # Watch these file extensions
  include_ext = ["go", "tpl", "tmpl", "html"]
  # Exclude these directories
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  # Exclude files matching these patterns
  exclude_file = []
  # Exclude unchanged files
  exclude_unchanged = false
  # Follow symbolic links
  follow_symlink = false
  # Build delay after file change (ms)
  delay = 1000
  # Stop running old binary before building
  stop_on_error = true
  # Send interrupt signal before kill
  send_interrupt = false
  # Delay after sending interrupt signal (ms)
  kill_delay = 500

[log]
  # Log time
  time = false

[color]
  # Use color output
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true
