# =============================================================================
# Accountant CRM - ECS Production Stack (Single Server)
# =============================================================================
# Deploy to: 8.211.195.17 (ECS Server)
# Cost: ~$17/month
#
# Architecture:
#   - System nginx handles SSL termination and serves multiple websites
#   - Go backend exposed to localhost:8080 for system nginx to proxy
#   - Frontend served as static files by system nginx from /var/www/frontend
#   - Redis runs in Docker for session/cache storage
#
# Usage:
#   1. Copy this file to ECS server at /opt/accountant-crm/
#   2. Create .env file with secrets
#   3. docker compose -f docker-compose.ecs.yml up -d
#   4. Configure system nginx to proxy api.irislondonshoes.com -> localhost:8080
#   5. Deploy frontend via: ./scripts/deploy-frontend.sh production
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Go Backend Service
  # ---------------------------------------------------------------------------
  # Exposed to localhost:8080 for system nginx to proxy
  # System nginx handles SSL termination for api.irislondonshoes.com
  go-backend:
    image: accountant-go-backend:latest
    container_name: accountant-go-backend
    ports:
      - "127.0.0.1:8080:8080"  # Localhost only - system nginx proxies here
    environment:
      - APP_ENV=production
      - GO_PORT=8080
      # Neon PostgreSQL (external - FREE tier)
      - POSTGRES_HOST=${NEON_HOST}
      - POSTGRES_PORT=5432
      # IMPORTANT: Use app_user (NOBYPASSRLS) for RLS enforcement.
      # Fallback to NEON_USER only if POSTGRES_USER is not set.
      - POSTGRES_USER=${POSTGRES_USER:-${NEON_USER}}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${NEON_PASSWORD}}
      - POSTGRES_DB=${NEON_DATABASE}
      - POSTGRES_SSLMODE=require
      # Redis (local container)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_TLS_ENABLED=false
      # Security
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL:-https://crm.irislondonshoes.com}
      # Python AI service (internal)
      - PYTHON_AI_URL=http://python-ai:8000
      - PYTHON_AI_TIMEOUT=30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - accountant-network
    restart: unless-stopped
    # Note: No healthcheck - using distroless image without shell/wget
    # Health is verified via API endpoints (/health, /ready)

  # ---------------------------------------------------------------------------
  # Python AI Service
  # ---------------------------------------------------------------------------
  python-ai:
    image: accountant-python-ai:latest
    container_name: accountant-python-ai
    expose:
      - "8000"
    environment:
      - APP_ENV=production
      - PYTHON_PORT=8000
      # Neon PostgreSQL (external - FREE tier) - shared with Go backend
      - POSTGRES_HOST=${NEON_HOST}
      - POSTGRES_PORT=5432
      # IMPORTANT: Use app_user (NOBYPASSRLS) for RLS enforcement.
      # Fallback to NEON_USER only if POSTGRES_USER is not set.
      - POSTGRES_USER=${POSTGRES_USER:-${NEON_USER}}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${NEON_PASSWORD}}
      - POSTGRES_DATABASE=${NEON_DATABASE}
      - POSTGRES_SSLMODE=require
      # MongoDB Atlas (external - FREE tier)
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=accountant_ai
      # Redis (local container)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # CORS
      - CORS_ALLOWED_ORIGINS=https://crm.irislondonshoes.com,https://api.irislondonshoes.com
      # Features
      - MTLS_ENABLED=false
      - AI_OCR_ENABLED=true
      - AI_CHAT_ENABLED=true
      - AI_FORMS_ENABLED=true
      - AI_CLASSIFICATION_ENABLED=true
      # Groq AI
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - accountant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Redis (Local - replaces managed Tair)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: accountant-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - accountant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Networks
# =============================================================================
networks:
  accountant-network:
    driver: bridge
    name: accountant-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    name: accountant-redis-data
