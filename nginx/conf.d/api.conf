# =============================================================================
# api.irislondonshoes.com - Go Backend API
# =============================================================================

# Use Docker DNS resolver for dynamic resolution
resolver 127.0.0.11 valid=10s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.irislondonshoes.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name api.irislondonshoes.com;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.irislondonshoes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.irislondonshoes.com/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # CORS Headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    # Handle preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Variables for dynamic resolution
    set $go_backend http://go-backend:8080;

    # Health check (no auth needed)
    location /health {
        proxy_pass $go_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Readiness check
    location /ready {
        proxy_pass $go_backend/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All API routes -> Go Backend
    location / {
        proxy_pass $go_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
