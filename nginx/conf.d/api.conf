# =============================================================================
# api.irislondonshoes.com - Go Backend API
# =============================================================================
# REFERENCE CONFIG FOR SYSTEM NGINX
# Copy to: /etc/nginx/sites-available/api.irislondonshoes.com
# Enable:  ln -s /etc/nginx/sites-available/api.irislondonshoes.com /etc/nginx/sites-enabled/
# =============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.irislondonshoes.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name api.irislondonshoes.com;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.irislondonshoes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.irislondonshoes.com/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # CORS handled by Go backend middleware (middleware/cors.go)
    # Backend validates origin against allowed list and sets proper headers
    # Do NOT add CORS headers here - it would override backend security

    # Go backend runs in Docker, exposed to localhost:8080
    set $go_backend http://127.0.0.1:8080;

    # Health check (no auth needed)
    location /health {
        proxy_pass $go_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Readiness check
    location /ready {
        proxy_pass $go_backend/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All API routes -> Go Backend
    location / {
        proxy_pass $go_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
