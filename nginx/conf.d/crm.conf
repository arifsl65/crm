# =============================================================================
# crm.irislondonshoes.com - Frontend (Next.js Static Export)
# =============================================================================
# REFERENCE CONFIG FOR SYSTEM NGINX
# Copy to: /etc/nginx/sites-available/crm.irislondonshoes.com
# Enable:  ln -s /etc/nginx/sites-available/crm.irislondonshoes.com /etc/nginx/sites-enabled/
#
# Frontend deployed via: ./scripts/deploy-frontend.sh production
# Deploys to: /var/www/frontend (via rsync)
# =============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name crm.irislondonshoes.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name crm.irislondonshoes.com;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/crm.irislondonshoes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.irislondonshoes.com/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Root directory for static files
    root /var/www/frontend;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next.js static export routing
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Static assets caching
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon and other root files
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
}
