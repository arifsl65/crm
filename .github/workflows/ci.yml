# =============================================================================
# Accountant CRM - CI Pipeline
# =============================================================================
# Runs on every PR and push to main
# - Linting
# - Type checking
# - Unit tests
# - Build verification
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # Go Backend
  # ===========================================================================
  go-backend:
    name: Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go-backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: go-backend
          args: --timeout=5m

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: go-backend/coverage.out
          flags: go-backend
          fail_ci_if_error: false

      - name: Build
        run: go build -v -o bin/server ./cmd/server

      - name: Build Docker image
        run: docker build -t accountant-go-backend:${{ github.sha }} --target production .

  # ===========================================================================
  # Python AI Service
  # ===========================================================================
  python-ai:
    name: Python AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python-ai/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff (linting)
        run: ruff check .

      - name: Run Ruff (formatting)
        run: ruff format --check .

      - name: Run mypy (type checking)
        run: mypy --ignore-missing-imports .

      - name: Run tests
        run: pytest -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: python-ai/coverage.xml
          flags: python-ai
          fail_ci_if_error: false

      - name: Build Docker image
        run: docker build -t accountant-python-ai:${{ github.sha }} --target production .

  # ===========================================================================
  # Frontend
  # ===========================================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
          retention-days: 7

  # ===========================================================================
  # Terraform Validation
  # ===========================================================================
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (staging)
        run: |
          terraform plan \
            -var-file=staging.tfvars \
            -var="alicloud_access_key=dummy" \
            -var="alicloud_secret_key=dummy" \
            -input=false \
            -no-color
        continue-on-error: true

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Database Migrations Validation
  # ===========================================================================
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          migrate --version

      - name: Run UP migrations
        run: |
          migrate -path=migrations -database="postgres://test:test@localhost:5432/test_db?sslmode=disable" up

      - name: Verify tables exist
        run: |
          PGPASSWORD=test psql -h localhost -U test -d test_db \
            -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;"

      - name: Verify schema_migrations table
        run: |
          PGPASSWORD=test psql -h localhost -U test -d test_db \
            -c "SELECT version, dirty FROM schema_migrations;"

      - name: Run DOWN migrations
        run: |
          migrate -path=migrations -database="postgres://test:test@localhost:5432/test_db?sslmode=disable" down -all

      - name: Verify tables dropped
        run: |
          count=$(PGPASSWORD=test psql -h localhost -U test -d test_db -t \
            -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name != 'schema_migrations';")
          if [ "$count" -gt 0 ]; then
            echo "Tables still exist after DOWN migration"
            exit 1
          fi

  # ===========================================================================
  # All Checks Summary
  # ===========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [go-backend, python-ai, frontend, terraform, security, migrations]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.go-backend.result }}" != "success" ] || \
             [ "${{ needs.python-ai.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.terraform.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.migrations.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
